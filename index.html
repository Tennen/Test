<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="成人高考专升本政治选择题练习。逐题作答、收藏、错题复习，手机端静态题库。"><title>政治选择题 · 随身练习</title><link rel="stylesheet" href="style.css?v=20261009"></head>
<body>
<div class="app">
<header class="topbar"><button class="icon" id="homeBtn" aria-label="选择试卷"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><button id="progressBtn" class="progress" aria-label="打开答题卡">1<span>/0</span></button><div class="tools"><button class="icon" id="starBtn" aria-label="收藏本题" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.55 4.43 1.07 6.27L12 17.34l-5.62 2.96 1.07-6.27L2.9 9.6l6.3-.9Z"/></svg></button><button class="icon" id="cardBtn" aria-label="答题卡"><svg viewBox="0 0 24 24"><path d="M15 21H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8M7 8h9M7 12h6m3 5 5 5m-6-7 3 3"/></svg></button><button class="icon" id="menuBtn" aria-label="更多选项"><svg viewBox="0 0 24 24" class="dots"><circle cx="4" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/></svg></button></div></header>

</div>
<dialog id="panel"><div class="sheet-header"><div><span id="panelEyebrow" class="eyebrow"></span><h2 id="panelTitle"></h2></div><button class="icon close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div id="panelBody"></div></dialog>
<div id="toast" role="status"></div><script src="questions.js"></script><script src="app.js?v=20261009-2"></script>
